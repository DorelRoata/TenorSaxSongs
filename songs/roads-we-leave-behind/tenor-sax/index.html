<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tenor Sax Play-Along</title><link rel="stylesheet" href="../../../shared/player.css"></head><body><main class="app"><header><div><a class="back" href="../../../">← All songs</a><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></div><div class="badge" id="badge"></div></header><section class="controls" aria-label="Playback controls"><button id="play">▶ Play</button><button id="stop" class="secondary">■ Stop</button><button id="finger" class="secondary">Fingering chart</button><button id="print" class="secondary">Print sheet</button><a class="pdf secondary" href="sheet.pdf">PDF</a><label>Tempo <input id="tempo" type="range"> <span id="tempoValue"></span></label><label><input id="melodyCue" type="checkbox" checked> Melody cue</label><label><input id="loop" type="checkbox"> Loop</label><div class="status" id="status"></div></section><div class="sheet-wrap"><svg id="sheet" role="img" aria-label="Tenor sax sheet music"></svg></div><section class="notes"><article class="card"><h2>How to count</h2><p id="counting"></p></article><article class="card"><h2>Transposition</h2><p id="transposition"></p></article></section></main><dialog id="fingerDialog"><div class="finger-heading"><div><span class="eyebrow">B♭ Tenor Sax</span><h2>Fingerings in this song</h2></div><button id="closeFinger" aria-label="Close fingering chart">×</button></div><p class="finger-help">Dark circles are pressed keys. The card matching the current play-along note lights up.</p><div id="fingerGrid" class="finger-grid"></div><p class="finger-legend"><strong>L</strong> = left hand · <strong>R</strong> = right hand · <strong>Oct</strong> = octave key</p></dialog><script src="song.js"></script><script src="../../../shared/player.js"></script></body></html>
